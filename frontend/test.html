<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Test</title>
    <script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script>
        if (typeof ethers === 'undefined') {
            document.write('<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"><\/script>');
        }
    </script>
</head>
<body>
    <h1>Ethers.js Library Test</h1>
    <div id="result"></div>

    <script>
        const result = document.getElementById('result');

        if (typeof ethers !== 'undefined') {
            result.innerHTML = `
                <p style="color: green;">✅ ethers.js loaded successfully!</p>
                <p><strong>Version:</strong> ${ethers.version || '5.7.2'}</p>
                <p><strong>Utils available:</strong> ${typeof ethers.utils !== 'undefined' ? 'Yes ✅' : 'No ❌'}</p>
                <p><strong>Providers available:</strong> ${typeof ethers.providers !== 'undefined' ? 'Yes ✅' : 'No ❌'}</p>
                <p><strong>Contract available:</strong> ${typeof ethers.Contract !== 'undefined' ? 'Yes ✅' : 'No ❌'}</p>

                <hr>
                <h3>Test Functions:</h3>
                <p><strong>parseEther("1.5"):</strong> ${ethers.utils.parseEther("1.5").toString()}</p>
                <p><strong>formatEther("1500000000000000000"):</strong> ${ethers.utils.formatEther("1500000000000000000")}</p>
                <p><strong>isAddress("0x715f70ef11A65b4c8A7CCAa32E8aAaeE5011F15e"):</strong> ${ethers.utils.isAddress("0x715f70ef11A65b4c8A7CCAa32E8aAaeE5011F15e")}</p>
            `;
        } else {
            result.innerHTML = '<p style="color: red;">❌ Failed to load ethers.js</p>';
        }
    </script>
</body>
</html>
